# ============================================================================
#  /etc/nginx/sites-available/law-proj-all.conf
#
#  4 个项目共用一台内网 Ubuntu 宿主机上的 Nginx：
#    law1.hexilab.cn -> /var/www/law1-web + 127.0.0.1:8001   （其他组 lawllm1）
#    law2.hexilab.cn -> /var/www/law2-web + 127.0.0.1:8002   （其他组 lawllm2）
#    law3.hexilab.cn -> /var/www/law3-web + 127.0.0.1:8003   （第三组 lawsys1 = 本项目）
#    law4.hexilab.cn -> /var/www/law4-web + 127.0.0.1:8004   （其他组 lawsys2）
#
#  规则：
#    - 静态页面直接读宿主机目录（前端 dist，不打进镜像）
#    - /api/ 反代到对应后端容器（容器统一在 8000 端口提供服务）
#    - 80 全部 301 到 443；HTTPS 用 *.hexilab.cn 泛域名证书
#    - 不使用 if ($host) 嵌套 location，一个域名一个 server 块
#
#  注意：本项目（law3）后端 context-path=/api，容器内健康检查是 /api/health，
#        所以 law3 的 /health 做了转发；law1/law2/law4 按交付规范直接代理 /health。
#        如果某个组的 context-path 也是 /api，把它的 /health 改成 /api/health 即可。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name law1.hexilab.cn law2.hexilab.cn law3.hexilab.cn law4.hexilab.cn;
    return 301 https://$host$request_uri;
}

# ==================== law1.hexilab.cn  （lawllm1 / 本项目） ====================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name law1.hexilab.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    root /var/www/law1-web;
    index index.html;
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：含 SSE 流式检索（/api/cases/search-stream）和 AI 摘要等长耗时请求，
    # 必须关闭 proxy_buffering 并把超时放宽到 30 分钟，否则前端会拿到 504。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        access_log off;
    }
}

